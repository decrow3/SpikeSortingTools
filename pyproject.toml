# Editable-install shim for the research repository.
#
# This file exists so that ``import pipeline`` works from any working
# directory, on any machine, without a PYTHONPATH incantation. It deliberately
# declares NO dependencies: the production runtime is defined and locked by
# environments/rescue-production, and this package must never influence that
# resolution.
#
# It is intentionally NOT added to environments/rescue-production/pyproject.toml.
# Doing so would regenerate uv.lock, which changes uv_lock_sha256, which is part
# of the materialization request digest in pipeline/preprocess.py. Existing
# accepted recordings would then fail to reuse with "Existing recording cache
# belongs to another request". Install it into the locked runtime with:
#
#     uv pip install --python environments/rescue-production/.venv -e .
#
# See README.md and docs/decisions/ for the surrounding rationale.

[project]
name = "spikesortingtools"
version = "0.1.0"
description = "Huk Lab Neuropixels spike sorting pipeline (research repository)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
# In editable mode, put the repository root on sys.path so the production run
# sheets and the testing/ research modules resolve the same way they do when
# the repository is the working directory.
dev-mode-dirs = ["."]
